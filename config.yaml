# =====================================================================
#  JobHunter — configuration
#  Début de carrière en corporate finance / investissement en Suisse :
#  stages, summer / off-cycle, graduate programmes, analyst / junior
#  en M&A, investment banking, private equity, VC, asset management
# =====================================================================

database: data/jobs.sqlite
output_dir: output
active_days: 21          # une offre non revue depuis 21 jours sort du rapport

# ---------------------------------------------------------------------
# Comportement réseau (anti-blocage). Plus c'est lent, plus c'est sûr.
# ---------------------------------------------------------------------
politeness:
  min_delay: 3           # secondes minimum entre 2 requêtes au même domaine
  max_delay: 7           # délai tiré au hasard entre min et max
  max_retries: 4         # sur 429 / 5xx / erreur réseau, avec backoff
  max_failures_per_domain: 3   # au-delà : domaine ignoré jusqu'au prochain passage
  respect_robots_txt: true     # pour les pages HTML (pas pour les API des ATS)
  timeout: 25
  # user_agent: "..."    # par défaut : un Chrome récent

# ---------------------------------------------------------------------
# Filtrage
# ---------------------------------------------------------------------
filters:
  swiss_only: true
  early_career_only: true    # écarte tout ce qui n'est pas stage / graduate / analyst / junior
  include_associate: true    # « Associate » (PE/IB : 2-4 ans d'exp.) ; false pour l'écarter
  # Niveaux à garder (supprime une ligne pour l'exclure) :
  levels:
    - Stage / Internship
    - Graduate programme
    - Analyst / Junior
    - Associate
  # Domaines à garder (supprime une ligne pour l'exclure). « Programme général »
  # = stage / graduate programme d'une société cible sans domaine dans l'intitulé.
  domains:
    - M&A / Investment Banking
    - Private Equity / VC / Private Markets
    - Asset Management / Investments
    - Wealth Management / Private Banking
    - Programme général
    - Finance (d'après la description)
  min_score: 0
  exclude_languages: [de]   # écarte les annonces rédigées en allemand
  exclude_title:             # fonctions hors corporate finance, même dans une banque
    - software
    - developer
    - développeur
    - engineer
    - devops
    - data scientist
    - cyber
    - security
    - technology
    - informatik
    - human resources
    - ressources humaines
    - talent acquisition
    - recruit
    - marketing
    - communication
    - design
    - legal
    - juriste
    - lawyer

# ---------------------------------------------------------------------
# Sites carrières
# ---------------------------------------------------------------------
ats:
  detect_cache_days: 30      # méthode d'accès à chaque site mémorisée 30 jours
  workday_max_pages: 3
  detail_pages: 6            # fiches d'offres ouvertes par société (lieu, langue, date via JSON-LD)
  workday_search_terms:      # Workday : recherche ciblée plutôt que tout lister
    - intern
    - internship
    - stage
    - graduate
    - trainee
    - summer
    - off-cycle
    - analyst
    - junior

# ---------------------------------------------------------------------
# Sociétés : voir firms.yaml (liste exhaustive, une entrée par société)
# ---------------------------------------------------------------------
firms_file: firms.yaml

careers:
  parallel: 3           # navigateurs en parallèle (sociétés différentes, donc sites différents)
  min_delay: 3          # pause aléatoire (s) entre deux pages d'un même navigateur
  max_delay: 6
  timeout: 30           # s max pour charger une page
  settle: 6             # s max d'attente que la page ait fini de charger ses offres
  browser_every_days: 1 # relire chaque site tous les N jours (2 = un jour sur deux)
  resume_hours: 10      # passage interrompu puis relancé : sociétés lues depuis < 10 h non refaites

# ---------------------------------------------------------------------
# JobSpy (LinkedIn, Indeed) — sans compte, IP seulement
# ---------------------------------------------------------------------
jobspy:
  enabled: true
  sites: [linkedin, indeed]   # google renvoyait 0 résultat : retiré
  locations: [Switzerland]
  country_indeed: Switzerland
  hours_old: 72               # passages quotidiens : 3 jours suffisent
  first_run_hours_old: 720    # 1er passage (ou recherches modifiées) : 30 jours
  results_wanted: 50
  delay_between_queries: [25, 55]
  proxies: []
  search_terms:
    # anglais
    - M&A intern
    - M&A analyst
    - investment banking intern
    - investment banking analyst
    - corporate finance intern
    - transaction services intern
    - private equity intern
    - private equity analyst
    - venture capital intern
    - asset management intern
    - investment analyst intern
    - summer analyst
    - off-cycle internship
    - graduate programme finance
    - investment intern
    - venture capital analyst
    - private markets intern
    - equity research intern
    - graduate programme banking
    - wealth management intern
    - corporate finance analyst
    - valuation intern
    - private debt analyst
    # français
    - stage fusions acquisitions
    - stage private equity
    - stage finance d'entreprise
    - stage gestion d'actifs

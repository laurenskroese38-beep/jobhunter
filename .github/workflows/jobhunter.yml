name: JobHunter

on:
  schedule:
    # GitHub only understands UTC and sometimes drops runs planned at the top of the hour,
    # so there are several triggers around 17:00 Swiss time; the "gate" step lets through
    # only the first one after 16:45 Zurich time that day (the others are skipped).
    - cron: "47 14 * * *"
    - cron: "47 15 * * *"
    - cron: "17 16 * * *"
    - cron: "47 16 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "full = LinkedIn/Indeed + e-mail alerts + career sites | sites | jobspy"
        default: full
        type: choice
        options: [full, sites, jobspy]
      lookback_days:
        description: "LinkedIn/Indeed: how many days back (empty = automatic, since the last complete run)"
        default: ""
        type: string

concurrency:
  group: jobhunter
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Run once a day, from 16:45 Zurich time
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            now=$(TZ=Europe/Zurich date +%H%M)
            today=$(TZ=Europe/Zurich date +%Y-%m-%d)
            if [ "$now" -lt 1645 ]; then
              echo "Before 16:45 in Zurich ($now): skipping."; go=false
            else
              # a real run (scheduled, or started by hand / by Claude's daily trigger) already
              # started today after 16:45 (Zurich)? then skip.
              # (runs stopped by this gate earlier in the day were created before 16:45)
              n=$(TZ=Europe/Zurich gh run list -R "$GITHUB_REPOSITORY" --workflow jobhunter.yml \
                    --limit 30 --json databaseId,createdAt,conclusion \
                    --jq "[.[] | select(.databaseId != ${{ github.run_id }})
                           | select(.conclusion == \"success\" or .conclusion == \"\" or .conclusion == null)
                           | select((.createdAt | fromdate | strflocaltime(\"%Y-%m-%d %H%M\")) >= \"$today 1645\")]
                          | length" 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then echo "Already ran today: skipping."; go=false; fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore history (seen jobs, firm memory)
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobhunter-state-${{ github.run_id }}
          restore-keys: jobhunter-state-

      - name: Prepare
        if: steps.gate.outputs.go == 'true'
        run: |
          [ -f data/jobs.sqlite ] || cp data/seed.sqlite data/jobs.sqlite   # first run: start from the PC's history
          rm -f data/.lock
          # GitHub runners have more CPU than needed for 3 browsers: read 6 career sites at once
          python - <<'PY'
          import yaml
          c = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          c.setdefault("careers", {})["parallel"] = 6
          yaml.safe_dump(c, open("config.yaml", "w", encoding="utf-8"), allow_unicode=True, sort_keys=False)
          PY

      - name: Run
        if: steps.gate.outputs.go == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          mode="${{ github.event.inputs.mode || 'full' }}"
          flags=""
          [ "$mode" = "sites" ] && flags="--no-jobspy"
          [ "$mode" = "jobspy" ] && flags="--no-sites"
          [ -n "$LOOKBACK_DAYS" ] && export JOBHUNTER_LOOKBACK_HOURS=$((LOOKBACK_DAYS * 24))
          python run.py $flags

      - name: Save history
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: jobhunter-state-${{ github.run_id }}

      - name: Upload report (Excel) and logs
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jobhunter-report-${{ github.run_number }}
          path: |
            output/*.xlsx
            logs/
          retention-days: 30
          if-no-files-found: warn
